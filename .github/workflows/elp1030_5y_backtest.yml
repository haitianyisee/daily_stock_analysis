name: ELP1030 5Y Parallel Backtest v4

on:
  push:
    branches:
      - chatgpt-elp5y-backtest-20260828
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: elp1030-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        period:
          - { label: "2021b", start: "20210809", end: "20211231" }
          - { label: "2022",  start: "20220101", end: "20221231" }
          - { label: "2023",  start: "20230101", end: "20231231" }
          - { label: "2024",  start: "20240101", end: "20241231" }
          - { label: "2025",  start: "20250101", end: "20251231" }
          - { label: "2026a", start: "20260101", end: "20260807" }
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy baostock
      - name: Run ${{ matrix.period.label }} shard ${{ matrix.shard }} of 8
        run: |
          rm -rf elp1030_part_${{ matrix.period.label }}_${{ matrix.shard }}
          python research/elp1030_5y_backtest_v4_period_shard.py \
            --start ${{ matrix.period.start }} \
            --end ${{ matrix.period.end }} \
            --label ${{ matrix.period.label }} \
            --shard-index ${{ matrix.shard }} \
            --shard-total 8
      - name: Upload part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elp1030-part-${{ matrix.period.label }}-${{ matrix.shard }}
          path: elp1030_part_${{ matrix.period.label }}_${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: part
    if: ${{ always() && needs.part.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy baostock
      - name: Download all part artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: elp1030-part-*
          path: part_artifacts
      - name: Merge and calculate final metrics
        run: |
          echo "Artifacts:"
          find part_artifacts -maxdepth 2 -type f | sort | head -100
          python research/elp1030_5y_merge_v4.py --input part_artifacts --output elp1030_results
      - name: Upload final five-year results
        uses: actions/upload-artifact@v4
        with:
          name: elp1030-5y-v4-results
          path: elp1030_results/
          if-no-files-found: error
          retention-days: 90
